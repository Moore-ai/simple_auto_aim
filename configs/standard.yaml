image_width: 1280
image_height: 1024

# ==================== 前哨站专用滤波器配置 ====================
# outpost_model 决定实际使用 current 还是 v2；两个配置段都需要保留，
# 因为 Tracker 启动时会同时读取两段配置。
outpost_model: current # 模型选择：current=固定低/中/高板高度模型，v2=相位编号与高度差在线估计模型
outpost_current: # current 专用配置；id=0/1/2 固定对应低/中/高装甲板
  P0: [1, 64, 1, 64, 1, 81, 0.4, 0] # 初始协方差对角线，状态顺序为[x,vx,y,vy,z,vz,yaw,yaw_rate]
  accel_var: 10 # 平移加速度过程噪声方差，单位 m²/s⁴
  yaw_var: 4e-3 # 单块装甲板视线方位角观测方差，单位 rad²
  pitch_var: 4e-3 # 单块装甲板视线俯仰角观测方差，单位 rad²
  armor_yaw_base: 9e-2 # 单块装甲板自身朝向观测的基础方差，单位 rad²
  velocity_clamp_enabled: false # 是否限制 x/y/z 三轴线速度
  max_linear_speed: 5.0 # current 模型线速度限幅，单位 m/s
outpost_v2: # v2 模型专用配置；id=0/1/2 表示初始化相位及其后两个 120° 相位
  P0: [0.04, 0.01, 0.04, 0.01, 0.04, 0.01, 0.25, 6.25, 0.1, 0.1] # 初始协方差对角线，状态顺序为[x,vx,y,vy,z0,vz,yaw,yaw_rate,dz1,dz2]
  radius: 0.2765 # 前哨站旋转半径，单位 m
  yaw_rate_magnitude: 2.5132741229 # 已知角速度幅值 0.8π，单位 rad/s
  is_fit_yaw_rate: false # true=由 EKF 估计角速度，false=方向确定后使用固定 ±yaw_rate_magnitude
  q_xy: 0.01 # x/y 平移过程噪声强度
  q_z: 0.001 # z 平移过程噪声强度
  q_yaw: 10.0 # yaw 过程噪声强度
  q_yaw_rate: 10.0 # yaw_rate 过程噪声强度
  q_dz: 0.001 # dz1/dz2 高度差过程噪声强度
  r_yaw: 0.01 # 相机方位角 yaw 观测噪声方差，单位 rad²
  r_pitch: 0.003 # 相机俯仰角 pitch 观测噪声方差，单位 rad²
  r_distance: 0.0125 # 距离观测噪声基数，实际随距离和夹角自适应
  r_armor_yaw: 0.08 # 装甲板自身朝向 yaw 观测噪声方差，单位 rad²
  frontal_angle_gate: 0.6108652382 # 前向可匹配角门限 35°，单位 rad
  yaw_match_gate: 0.8 # 装甲板朝向匹配门限，单位 rad
  position_match_gate: 0.8 # 装甲板三维位置匹配门限，单位 m
  mismatch_reset_count: 5 # 连续失配超过此次数后重置方向与角速度
  direction_sample_count: 30 # 方向判定所需的有效观测数量
  direction_compare_interval: 3 # 方向判定时比较的帧间隔
  direction_stable_threshold: 0.005 # 判定静止方向的角度变化门限，单位 rad
  direction_jump_threshold: 0.4 # 过滤角度跳变的门限，单位 rad
observation_mode: "pnp" # pnp | reprojection

pnp:
  enable_lightbar_assist: false
  enable_yaw_refinement: false
  enable_outpost_distance_optimizer: false # 前哨站六点 PnP 距离优化（4 个装甲角点 + 相邻灯条 2 点）

target_geometry_cache:
  enabled: false

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true
detect_method: "yolo"              # YOLO 主检测；use_traditional=true 时进行传统方法二次校正
debug_window: false                # 是否显示 OpenCV 调试窗口；Web/WSL 环境建议关闭

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false # 是否启用 ROI 裁切，启用后会只检测该区域，减少计算量
cost_fn: "l1" # 重投影代价函数：l1(鲁棒), l2²(尖锐)

#####-----传统方法参数-----#####
threshold: 150                    # 灰度图二值化阈值，越低对反光越敏感
max_angle_error: 45               # degree 灯条最大偏角容差，超过则视为无效灯条
min_lightbar_ratio: 1.5           # 灯条最小长宽比，滤除方形/圆形反光区域
max_lightbar_ratio: 20            # 灯条最大长宽比，滤除过长伪影
min_lightbar_length: 8            # 像素 灯条最小长度，滤除噪声点
min_armor_ratio: 1                # 装甲板最小宽高比，滤除过窄组合
max_armor_ratio: 5                # 装甲板最大宽高比，滤除过宽组合
max_side_ratio: 1.5               # 左右灯条最大长度差比例，滤除不对称组合
max_rectangular_error: 25         # degree 装甲板矩形偏差容差，控制角点是否共面

#####-----tracker参数-----#####
min_detect_count: 5               # 帧 连续检测到目标后，状态从 detecting → tracking
max_temp_lost_count: 15           # 帧 短暂丢失上限，超过则状态从 temp_lost → lost
outpost_max_temp_lost_count: 75   # 帧 前哨站短暂丢失上限，高于普通值（前哨站旋转时遮挡时间长）

#####-----滤波器配置-----#####
# 以下 filter / *_obs 配置仅用于普通目标；前哨站使用上面的专用配置。
filter_method: "ekf"                  # 普通目标滤波器类型："ekf"(标准EKF), "inekf"(左不变误差EKF), "ukf"(无迹卡尔曼滤波)

reprojection_obs:
  angle_var: 0.01 # 固定角度观测方差（rad²）；仅未启用自适应噪声时使用，增大则减弱角度更新。
  pixel_var: 16.0 # 固定中心像素观测方差（px²）；仅未启用自适应噪声时使用，增大则减弱位置更新。
  length_var: 25.0 # 固定灯条长度观测方差（px²）；仅未启用自适应噪声时使用，增大则减弱尺度更新。
  r_sigma_px_by_length_ratio: 0.2 # 自适应中心像素 sigma 系数：sigma = 系数 × 灯条像素长度；与下两项同时存在时启用。
  r_sigma_length_by_length_ratio: 0.5 # 自适应灯条长度 sigma 系数：sigma = 系数 × 灯条像素长度。
  r_sigma_angle: 0.1 # 自适应角度 sigma（rad）；增大则降低角度观测权重。
  r_sigma_armor_lights_depth_diff: 0.1 # 装甲板与相邻灯条深度差的 sigma（m）；增大则减弱该补充约束。
  armor_match_gate: 200.0 # 全部装甲板编号已见过时的装甲板匹配代价上限；超限检测不参与关联。
  armor_match_gate_not_all_init: 1000.0 # 编号尚未全部初始化时的宽松匹配代价上限。
  armor_match_w_center_err: 5.0 # 装甲板匹配代价中中心像素距离误差（px）的权重。
  armor_match_w_angle_err: 10.0 # 装甲板匹配代价中四边方向误差（rad）的权重。
  armor_match_w_side_length_err: 1.0 # 装甲板匹配代价中周长相对误差（无量纲）的权重。
  light_match_length_ratio_gate: 0.2 # 灯条长度相对预测值的最大允许偏差；超限则拒绝匹配。
  light_match_angle_gate: 0.2 # 灯条方向与预测方向的最大允许偏差（rad）；超限则拒绝匹配。
  light_match_pos_gate_by_length_ratio: 5.0 # 灯条两端总像素误差上限 = 该系数 × 预测灯条长度。
  radius_min: 0.05 # 重投影模式目标旋转半径下限（m），避免滤波结果退化。
  radius_max: 1.0 # 重投影模式目标旋转半径上限（m），防止滤波结果发散。

#####-----滤波器共用参数（EKF/InEKF 共用）-----#####
filter:
  # 普通目标过程噪声（Piecewise White Noise Model）
  accel_var: 100                  # 加速度方差 v1（前哨站除外）
  angular_accel_var: 400          # 角加速度方差 v2（前哨站除外）

  # 普通目标初始协方差 P0 对角线（按兵种分）
  P0:
    default: [1, 64, 1, 64, 1, 64, 0.4, 100, 1, 1, 1]
    balance: [1, 64, 1, 64, 1, 64, 0.4, 100, 1, 1, 1]
    base: [1, 64, 1, 64, 1, 64, 0.4, 100, 1e-4, 0, 0]

  # 初始半径
  radius:
    default: 0.2
    base: 0.3205

# 普通目标 EKF 的观测噪声；outpost current/v2 不读取这里。
#####-----EKF 特有观测噪声（ypd 空间，仅普通目标 filter_method="ekf" 时使用）-----#####
ekf_obs:
  yaw_var: 4e-3               # 视线中 yaw 观测方差
  pitch_var: 4e-3             # 视线中 pitch 观测方差
  armor_yaw_base: 9e-2        # armor_yaw 基础方差

#####-----InEKF 特有观测噪声（xyz 空间，仅 filter_method="inekf" 时使用）-----#####
inekf_obs:
  xy_var: 0.0036              # m² XY 位置观测方差（sigma≈0.06m）
  z_var: 0.0064               # m² Z 位置观测方差（sigma≈0.08m）
  yaw_var: 0.0144             # rad² yaw 观测方差（sigma≈0.12rad）
  dist_scale_denom: 25.0      # 距离自适应分母，d=sqrt(denom) 时 scale=2，调参阶段按需修改

#####-----UKF 特有观测噪声（xyz 空间，仅 filter_method="ukf" 时使用）-----#####
ukf_obs:
  xy_var: 0.0036              # m² XY 位置观测方差
  z_var: 0.0064               # m² Z 位置观测方差
  yaw_var: 0.0144             # rad² yaw 观测方差
  dist_scale_denom: 25.0      # 距离自适应分母
  sigma_alpha: 0.001          # UKF sigma 点扩散系数
  sigma_beta: 2.0             # UKF 先验分布参数 (2.0=高斯)
  sigma_kappa: 0.0            # UKF 次级缩放参数

#####-----MPC 参数-----#####
yaw_offset: 2 # degree，瞄准 yaw 修正量
pitch_offset: 6.5 # degree，瞄准 pitch 修正量
decision_speed_enable: true # 启用 decision_speed 高低速阈值（控制发弹延迟与反小陀螺）
speed_hysteresis: 0.0 # rad/s 滞回半宽，防临界抖动
extra_delay: 0.0 # s 关闭高低速阈值时使用的固定延迟
decision_speed: 7 # rad/s，转速阈值，高于此值用高速延迟
high_speed_delay_time: 0.0 # s，高转速目标发弹延迟
low_speed_delay_time: 0.0 # s，低转速目标发弹延迟
anti_spin_enable: false # 高转速时启用反小陀螺策略，仅 decision_speed_enable=true 时生效
anti_spin_wait_armor: low # 等待板型，只能为 low（低板）或 high（高板）

camera_name: "hikrobot"
exposure_ms: 1.5
gain: 12.0
camera_index: 0
fps: 120
image_rotation: -90 # 图像旋转角度：-90、90、180（-180 等同 180）

virtual_camera:
  enable: false
  video_path: assets/demo/demo.avi

auto_exposure:
  enable: false
  target_brightness: 25.0
  tolerance: 3.0
  step_gain: 15.0
  decay_step: 1.0
  exposure_min: 200.0
  exposure_max: 3500.0
  control_interval_ms: 300

#  1  0  0
#  0  1  0
#  0  0  1
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 相机标定参数
camera_matrix: [2403.1136316935917, 0, 567.74249348659885, 0, 2407.3896390299665, 570.25063710517975, 0, 0, 1]
distort_coeffs: [-0.038237229814716757, 0.20323363149030885, 0.00076583801074767502, 0.000425404346006584, 0]

# 手眼标定参数；xyz 是云台系位置（m），ypr 是相对相机光轴的 ZYX 旋转（rad）。
camera2gimbal_mode: xyz_ypr
camera2gimbal_xyz: [0.11593, -0.06429, 0.03250]
camera2gimbal_ypr: [0.0, 0.0, 0.0]

#####-----gimbal参数-----#####
com_port: "/dev/ttyACM0"           # 串口路径
baudrate: 115200                   # 串口波特率
bytesize: 8                        # 数据位宽
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035              # 开火阈值（rad）：参考轨迹与规划轨迹在发射时刻的偏差 < 此值才开火
rho: 1.0                         # ADMM 惩罚参数，影响收敛速度
max_iter: 10                     # ADMM 最大迭代次数，越大求解越精确但耗时更长

fly_time_iteration:
  enable: false                  # 是否迭代求解预瞄点与弹丸飞行时间，关闭时保持单次预测
  max_iteration: 3               # 最大固定点迭代次数
  convergence_threshold: 1e-3    # s，相邻两次飞行时间差小于此值时停止迭代

max_yaw_acc: 50                  # yaw 最大角加速度约束 (rad/s²)，越大云台越激进
Q_yaw: [9e6, 0]                  # yaw MPC 跟踪权重 [角度误差权重, 角速度误差权重]
R_yaw: [1]                       # yaw MPC 控制量惩罚，越大运动越平滑

max_pitch_acc: 100               # pitch 最大角加速度约束 (rad/s²)
Q_pitch: [9e6, 0]                # pitch MPC 跟踪权重 [角度误差权重, 角速度误差权重]
R_pitch: [1]                     # pitch MPC 控制量惩罚

armor_selection_hysteresis:
  enable: false # 是否锁定当前瞄准装甲板，抑制相邻板在交界处来回切换
  switch_margin: 0.02 # m，候选板比当前板至少近此距离才算有效优势
  switch_confirm_frames: 3 # 帧，候选板连续领先此帧数后才切换；当前板失效时立即切换

bullet_speed_min: 10             # 弹速下限 (m/s)，低于此值视为无效
bullet_speed_max: 25             # 弹速上限 (m/s)，高于此值视为无效
bullet_speed_default: 22         # 弹速默认回退值 (m/s)，弹速无效时使用

#####-----AIMD自适应延迟(选配)-----#####
aimd:
  enable: false                    # 是否启用 AIMD 自适应延迟（开火反馈动态调整预测延迟）
  initial_delay: 0.015             # s 延迟初始值
  min_delay: 0.0                   # s 延迟下限
  max_delay: 0.10                  # s 延迟上限
  add_step: 0.005                  # s 开火成功时每帧线性减量
  mul_factor: 1.2                  # 连续未开火时乘性增幅因子
  fire_wait_threshold: 10          # 帧 连续未开火超过此帧数后开始增大延迟
  max_linear_speed: 3.0            # m/s 线速度归一化参考值
  max_angular_speed: 10.0          # rad/s 角速度归一化参考值

#####-----机动自适应(选配)-----#####
maneuver_adapt:
  enable: false                    # 启用机动自适应（NIS→轨迹速度阻尼）
  nis_threshold: 10.0             # NIS EMA 超过此值视为机动
  damping_factor: 0.7             # 机动时轨迹速度最大衰减比例(0=不衰减,1=完全停止)
  ema_alpha: 0.3                  # NIS EMA 平滑系数

#####-----速度限幅(选配)-----#####
vel_clamp:
  enable: false                    # 启用速度限幅（钳位 EKF 速度状态）
  max_linear_speed: 5.0           # m/s 最大线速度（均适用 vx/vy/vz）
  max_yaw_rate: 10.0              # rad/s 最大 yaw 角速度

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s
