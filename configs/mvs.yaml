# enemy_color: "red"
enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----USB相机参数-----#####
image_width: 640
image_height: 360
new_image_width: 1280
new_image_height: 720
fov_h: 57.7 #87.7
fov_v: 56.7 
new_fov_h: 37 #67
new_fov_v: 40.9
usb_frame_rate: 60
usb_exposure: 305 #1-80000______250
new_usb_exposure: 320
usb_gamma: 160
usb_gain: 10 #0-96

#####-----工业相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 2
gain: 16
vid_pid: "2bdf:0001"

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----EKF参数-----#####
ekf:
  # 过程噪声（Piecewise White Noise Model）
  accel_var: 100                  # 加速度方差 v1（前哨站除外）
  angular_accel_var: 400          # 角加速度方差 v2（前哨站除外）
  outpost_accel_var: 10           # 前哨站加速度方差
  outpost_angular_accel_var: 0.1  # 前哨站角加速度方差

  # 观测噪声
  obs_yaw_var: 4e-3               # yaw 观测方差
  obs_pitch_var: 4e-3             # pitch 观测方差
  obs_armor_yaw_base: 9e-2        # armor_yaw 基础方差

  # 初始协方差 P0 对角线（按兵种分）
  P0:
    default: [1, 64, 1, 64, 1, 64, 0.4, 100, 1, 1, 1]
    balance: [1, 64, 1, 64, 1, 64, 0.4, 100, 1, 1, 1]
    outpost: [1, 64, 1, 64, 1, 81, 0.4, 100, 1e-4, 0, 0]
    base: [1, 64, 1, 64, 1, 64, 0.4, 100, 1e-4, 0, 0]

  # 初始半径
  radius:
    default: 0.2
    outpost: 0.2765
    base: 0.3205

#####-----aimer参数-----#####
yaw_offset: -2.5 # degree -2.5
pitch_offset: 0  # degree 2
comming_angle: 70 # degree
leaving_angle: 30 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.066 # s
low_speed_delay_time: 0.015 # s

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----decider参数-----#####
mode: 1

#####-----工业相机标定参数-----#####
# 云台坐标系到 IMU 本体坐标系的变换
gimbal2imubody:
  xyz: [0, 0, 0]                    # m 平移
  rpy: [0.0000000000, 0.0000000000, 0.0000000000]  # rad [yaw, pitch, roll]

# 重投影误差: 0.1322px
camera_matrix: [1776.9477196851155, 0, 756.31235265560952, 0, 1776.0591253569607, 566.16539069551641, 0, 0, 1]
distort_coeffs: [-0.08382326954462313, 0.097449270330296239, -0.0012558283068959985, 0.0037372210254148081, 0]

# 云台到相机的固定变换（gimbal_link → camera_link）
# 代码内部会自动乘上固定的光轴转换（camera_link → camera_optical_frame, rpy=[-π/2, 0, -π/2]）
camera_joint:
  xyz: [0.1000000000, 0.0000000000, 0.0500000000]  # m
  rpy: [0.0000000000, 0.0000000000, 0.0000000000]  # rad [yaw, pitch, roll]


#####-----buff_detector参数-----#####
detect:
  contrast: 1
  brightness: 
    blue: -120
    red: -100
  brightness_threshold:
    blue: 120
    red: 80
  morphology_size:
    blue: 3
    red: 2
  dilate_size: 1
  # canny_low_threshold: 100
  # canny_high_threshold: 180
  # approx_epsilon: 1.0
  R_contours_min_area: 1
  R_contours_max_area: 600
  fanblades_head_contours_min_area: 300
  fanblades_head_contours_max_area: 8000
  fanblades_body_contours_min_area: 1000
  fanblades_body_contours_max_area: 4000
  standard_fanblade_path: ./assets/standard_fanblade.jpg

#####-----buff_aimer参数-----#####
aim_time: 0.200 # s
wait_time: 0.050 # s
predict_time: 0.300 # s
