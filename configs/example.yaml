# enemy_color: "red"
enemy_color: "blue"
outpost_model: current # 模型选择：current=固定低/中/高板高度模型，v2=相位编号与高度差在线估计模型
outpost_current: # current 模型专用配置；id=0/1/2 固定对应低/中/高装甲板
  P0: [1, 64, 1, 64, 1, 81, 0.4, 0] # 初始协方差对角线，状态顺序为[x,vx,y,vy,z,vz,yaw,yaw_rate]
  accel_var: 10 # 平移加速度过程噪声方差，单位 m²/s⁴
  yaw_var: 4e-3 # 装甲板观测方位角 yaw 方差，单位 rad²
  pitch_var: 4e-3 # 装甲板观测俯仰角 pitch 方差，单位 rad²
  armor_yaw_base: 9e-2 # 装甲板自身朝向 yaw 的基础观测方差，单位 rad²
  velocity_clamp_enabled: false # 是否限制 x/y/z 三轴线速度
  max_linear_speed: 5.0 # current 模型线速度限幅，单位 m/s
outpost_v2: # v2 模型专用配置；id=0/1/2 表示初始化相位及其后两个 120° 相位
  P0: [0.04, 0.01, 0.04, 0.01, 0.04, 0.01, 0.25, 6.25, 0.1, 0.1] # 初始协方差对角线，状态顺序为[x,vx,y,vy,z0,vz,yaw,yaw_rate,dz1,dz2]
  radius: 0.2765 # 前哨站旋转半径，单位 m
  yaw_rate_magnitude: 2.5132741229 # 已知角速度幅值 0.8π，单位 rad/s
  is_fit_yaw_rate: false # true=由 EKF 估计角速度，false=方向确定后使用固定 ±yaw_rate_magnitude
  q_xy: 10.0 # x/y 平移过程噪声强度
  q_z: 10.0 # z 平移过程噪声强度
  q_yaw: 10.0 # yaw 过程噪声强度
  q_yaw_rate: 10.0 # yaw_rate 过程噪声强度
  q_dz: 10.0 # dz1/dz2 高度差过程噪声强度
  r_yaw: 0.001 # 相机方位角 yaw 观测噪声方差，单位 rad²
  r_pitch: 0.001 # 相机俯仰角 pitch 观测噪声方差，单位 rad²
  r_distance: 0.001 # 距离观测噪声基数，实际随距离和夹角自适应
  r_armor_yaw: 0.001 # 装甲板自身朝向 yaw 观测噪声方差，单位 rad²
  frontal_angle_gate: 0.6108652382 # 前向可匹配角门限 35°，单位 rad
  yaw_match_gate: 1.5 # 装甲板朝向匹配门限，单位 rad
  position_match_gate: 0.05 # 装甲板三维位置匹配门限，单位 m
  mismatch_reset_count: 5 # 连续失配超过此次数后重置方向与角速度
  direction_sample_count: 30 # 方向判定所需的有效观测数量
  direction_compare_interval: 3 # 方向判定时比较的帧间隔
  direction_stable_threshold: 0.005 # 判定静止方向的角度变化门限，单位 rad
  direction_jump_threshold: 0.4 # 过滤角度跳变的门限，单位 rad
observation_mode: "pnp" # pnp | reprojection

pnp:
  enable_lightbar_assist: false
  enable_yaw_refinement: false
  enable_outpost_distance_optimizer: false # 前哨站六点 PnP 距离优化（4 个装甲角点 + 相邻灯条 2 点）

target_geometry_cache:
  enabled: false

reprojection_obs:
  angle_var: 0.01
  pixel_var: 16.0
  length_var: 25.0
  r_sigma_px_by_length_ratio: 0.2
  r_sigma_length_by_length_ratio: 0.5
  r_sigma_angle: 0.1
  r_sigma_armor_lights_depth_diff: 0.1
  armor_match_gate: 200.0
  armor_match_gate_not_all_init: 1000.0
  armor_match_w_center_err: 5.0
  armor_match_w_angle_err: 10.0
  armor_match_w_side_length_err: 1.0
  light_match_length_ratio_gate: 0.2
  light_match_angle_gate: 0.2
  light_match_pos_gate_by_length_ratio: 5.0
  radius_min: 0.05
  radius_max: 1.0


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600
  
#####-----USB相机参数-----#####
image_width: 1920
image_height: 1080
fov_h: 87.7
fov_v: 56.7 
usb_frame_rate: 60
usb_exposure: 250 #1-80000______250
usb_gamma: 160
usb_gain: 10 #0-96

#####-----工业相机参数-----#####
camera_name: "mindvision"
exposure_ms: 2
gamma: 0.5
vid_pid: "f622:d13a"

auto_exposure:
  enable: false
  target_brightness: 25.0
  tolerance: 3.0
  step_gain: 15.0
  decay_step: 1.0
  exposure_min: 200.0
  exposure_max: 3500.0
  control_interval_ms: 300

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15

#####-----EKF参数-----#####
ekf:
  # 过程噪声（Piecewise White Noise Model）
  accel_var: 100                  # 加速度方差 v1（前哨站除外）
  angular_accel_var: 400          # 角加速度方差 v2（前哨站除外）

  # 观测噪声
  obs_yaw_var: 4e-3               # yaw 观测方差
  obs_pitch_var: 4e-3             # pitch 观测方差
  obs_armor_yaw_base: 9e-2        # armor_yaw 基础方差

  # 初始协方差 P0 对角线（按兵种分）
  P0:
    default: [1, 64, 1, 64, 1, 64, 0.4, 100, 1, 1, 1]
    balance: [1, 64, 1, 64, 1, 64, 0.4, 100, 1, 1, 1]
    base: [1, 64, 1, 64, 1, 64, 0.4, 100, 1e-4, 0, 0]

  # 初始半径
  radius:
    default: 0.2
    base: 0.3205

#####-----aimer参数-----#####
yaw_offset: -2.5 # degree -2.5
pitch_offset: 3 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

#####-----工业相机标定参数-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 重投影误差: 0.1944px
camera_matrix: [1295.4665175006589, 0, 655.71498478800618, 0, 1297.2591156991834, 506.21320670125334, 0, 0, 1]
distort_coeffs: [-0.48599095566724387, 0.23999516531343185, -0.00029018466701866776, -0.00083639963030895752, 0]

# 相机同理想情况的偏角: yaw-2.64 pitch-3.20 roll-0.77 degree
# 标定板到世界坐标系原点的水平距离: 1.45 m
# 标定板同竖直摆放时的偏角: yaw90.85 pitch8.54 roll-0.32 degree
R_camera2gimbal: [0.046736929626455238, -0.055211941324114208, 0.99738021884550865, -0.99881598162461238, -0.016078770676278314, 0.0459141370909011, 0.013501639172863072, -0.99834518813322415, -0.055898041744621867]
t_camera2gimbal: [0.27420934670256336, 0.0098763306562371159, 0.043798385984197351]
# 外参也可使用以下格式（单位：xyz 为 m，ypr 为 rad，旋转顺序 ZYX）：
# camera2gimbal_mode: xyz_ypr
# camera2gimbal_xyz: [0.27420934670256336, 0.0098763306562371159, 0.043798385984197351]
# camera2gimbal_ypr: [0, 0, 0]
