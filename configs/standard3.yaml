enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true
detect_method: "yolo"              # 检测方法："yolo" 或 "traditional"，traditional 使用纯传统灯条检测

#####-----ROI-----#####
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false                    # 是否启用 ROI 裁切，启用后会只检测该区域，减少计算量

#####-----传统方法参数-----#####
threshold: 150                    # 灰度图二值化阈值，越低对反光越敏感
max_angle_error: 45               # degree 灯条最大偏角容差，超过则视为无效灯条
min_lightbar_ratio: 1.5           # 灯条最小长宽比，滤除方形/圆形反光区域
max_lightbar_ratio: 20            # 灯条最大长宽比，滤除过长伪影
min_lightbar_length: 8            # 像素 灯条最小长度，滤除噪声点
min_armor_ratio: 1                # 装甲板最小宽高比，滤除过窄组合
max_armor_ratio: 5                # 装甲板最大宽高比，滤除过宽组合
max_side_ratio: 1.5               # 左右灯条最大长度差比例，滤除不对称组合
max_rectangular_error: 25         # degree 装甲板矩形偏差容差，控制角点是否共面

#####-----tracker参数-----#####
min_detect_count: 5               # 帧 连续检测到目标后，状态从 detecting → tracking
max_temp_lost_count: 15           # 帧 短暂丢失上限，超过则状态从 temp_lost → lost
outpost_max_temp_lost_count: 75   # 帧 前哨站短暂丢失上限，高于普通值（前哨站旋转时遮挡时间长）

#####-----击打优先级配置-----#####
use_priority: false                # 是否启用兵种优先级，启用后按 priority_list 顺序选择目标
priority_list:                     # 优先级从高到低排列（未列出兵种优先级最低）
  - one
  - three
  - four
  - five
  - two
  - sentry
  - outpost
  - base

#####-----滤波器配置-----#####
filter_method: "ekf"                  # 滤波器类型："ekf"(标准EKF) 或 "inekf"(左不变误差EKF)

#####-----滤波器共用参数（EKF/InEKF 共用）-----#####
filter:
  # 过程噪声（Piecewise White Noise Model）
  accel_var: 100                  # 加速度方差 v1（前哨站除外）
  angular_accel_var: 400          # 角加速度方差 v2（前哨站除外）
  outpost_accel_var: 10           # 前哨站加速度方差
  outpost_angular_accel_var: 0.1  # 前哨站角加速度方差

  # 初始协方差 P0 对角线（按兵种分）
  P0:
    default: [1, 64, 1, 64, 1, 64, 0.4, 100, 1, 1, 1]
    balance: [1, 64, 1, 64, 1, 64, 0.4, 100, 1, 1, 1]
    outpost: [1, 64, 1, 64, 1, 81, 0.4, 100, 1e-4, 0, 0]
    base: [1, 64, 1, 64, 1, 64, 0.4, 100, 1e-4, 0, 0]

  # 初始半径
  radius:
    default: 0.2
    outpost: 0.2765
    base: 0.3205

#####-----EKF 特有观测噪声（ypd 空间，仅 filter_method="ekf" 时使用）-----#####
ekf_obs:
  yaw_var: 4e-3               # yaw 观测方差
  pitch_var: 4e-3             # pitch 观测方差
  armor_yaw_base: 9e-2        # armor_yaw 基础方差

#####-----InEKF 特有观测噪声（xyz 空间，仅 filter_method="inekf" 时使用）-----#####
inekf_obs:
  xy_var: 0.0036              # m² XY 位置观测方差（sigma≈0.06m）
  z_var: 0.0064               # m² Z 位置观测方差（sigma≈0.08m）
  yaw_var: 0.0144             # rad² yaw 观测方差（sigma≈0.12rad）

#####-----瞄准决策器-----#####
aim_method: "mpc"                 # 决策方法："mpc"（轨迹规划器，默认）或 "aimer"（传统决策器）

#####-----aimer参数-----#####
yaw_offset: 2 # degree（Planner/Aimer 共用）瞄准 yaw 修正量，-2.5 was previous
pitch_offset: 6.5 # degree（Planner/Aimer 共用）瞄准 pitch 修正量，2 was previous
comming_angle: 55 # degree（仅 Aimer 使用）小陀螺迎向角度阈值
leaving_angle: 20 # degree（仅 Aimer 使用）小陀螺离去角度阈值
# ------
decision_speed: 7 # rad/s（Planner/Aimer 共用）转速阈值，高于此值用高速延迟
high_speed_delay_time: 0.0 # s（Planner/Aimer 共用）高转速目标发弹延迟
low_speed_delay_time: 0.0 # s（Planner/Aimer 共用）低转速目标发弹延迟

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"           # 相机型号："hikrobot"（海康）或 "mindvision"（迈德威）
exposure_ms: 2.5                  # 曝光时间 (ms)，越大图像越亮但运动模糊越严重
gain: 16.9                        # 增益，越大图像越亮但噪声越大
vid_pid: "2bdf:0001"              # 相机 USB 的 VID:PID（用于 mindvision 和 hikrobot）

# 云台坐标系到 IMU 本体坐标系的变换
gimbal2imubody:
  xyz: [0, 0, 0]                    # m 平移（云台与 IMU 无平移偏移）
  rpy: [0, 0, 0]                    # rad [yaw, pitch, roll] 无旋转

# 重投影误差: 0.1820px
camera_matrix: [1785.4881526822305, 0, 672.4806478241826, 0, 1785.026019470562, 559.89603224794314, 0, 0, 1]
distort_coeffs: [-0.076005079619881746, 0.11182817466388446, 0.0005362204787722057, -0.0027546300984895122, 0]

# 云台到相机的固定变换（gimbal_link → camera_link），对应 HFUT 的 camera_joint
# 代码内部会自动乘上固定的光轴转换（camera_link → camera_optical_frame, rpy=[-π/2, 0, -π/2]）
camera_joint:
  xyz: [0.131607, 0.103777, 0.024908]  # m
  rpy: [-0.0250574546, 0.1269819084, 0.0168318837]  # rad [yaw, pitch, roll] 相机安装偏角（已去除光轴转换）

#####-----cboard参数-----#####
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0xff
can_interface: "can0"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"           # Gimbal 串口设备路径
yaw_kp: 0
yaw_kd: 0
pitch_kp: 0
pitch_kd: 0

#####-----planner-----#####
fire_thresh: 0.0035              # 开火阈值（rad）：参考轨迹与规划轨迹在发射时刻的偏差 < 此值才开火
rho: 1.0                         # ADMM 惩罚参数，影响收敛速度
max_iter: 10                     # ADMM 最大迭代次数，越大求解越精确但耗时更长

max_yaw_acc: 50                  # yaw 最大角加速度约束 (rad/s²)，越大云台越激进
Q_yaw: [9e6, 0]                  # yaw MPC 跟踪权重 [角度误差权重, 角速度误差权重]
R_yaw: [1]                       # yaw MPC 控制量惩罚，越大运动越平滑

max_pitch_acc: 100               # pitch 最大角加速度约束 (rad/s²)
Q_pitch: [9e6, 0]                # pitch MPC 跟踪权重 [角度误差权重, 角速度误差权重]
R_pitch: [1]                     # pitch MPC 控制量惩罚

bullet_speed_min: 10             # 弹速下限 (m/s)，低于此值视为无效
bullet_speed_max: 25             # 弹速上限 (m/s)，高于此值视为无效
bullet_speed_default: 22         # 弹速默认回退值 (m/s)，弹速无效时使用

#####-----AIMD自适应延迟(选配)-----#####
aimd:
  enable: false                    # 是否启用 AIMD 自适应延迟（开火反馈动态调整预测延迟）
  initial_delay: 0.015             # s 延迟初始值
  min_delay: 0.0                   # s 延迟下限
  max_delay: 0.10                  # s 延迟上限
  add_step: 0.005                  # s 开火成功时每帧线性减量
  mul_factor: 1.2                  # 连续未开火时乘性增幅因子
  fire_wait_threshold: 10          # 帧 连续未开火超过此帧数后开始增大延迟
  max_linear_speed: 3.0            # m/s 线速度归一化参考值
  max_angular_speed: 10.0          # rad/s 角速度归一化参考值

#####-----buff_detector参数-----#####
model: "assets/yolo11_buff_int8.xml"

#####-----buff_aimer参数-----#####
fire_gap_time: 0.700   # s
predict_time: 0.120     # s