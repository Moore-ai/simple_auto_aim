# 对称圆点阵标定板
pattern_cols: 11
pattern_rows: 8
center_distance_mm: 20

# 云台坐标系到 IMU 本体坐标系
R_gimbal2imubody: [1, 0, 0, 0, 1, 0,  0, 0, 1]

# 海康相机
camera_name: "hikrobot"
exposure_ms: 5.5
gain: 16.0
image_width: 1280
image_height: 1024
camera_index: 0
fps: 120
image_rotation: -90

# 云台串口
com_port: "/dev/ttyACM0"
baudrate: 115200
bytesize: 8
